name: Compilar EXE Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
          cache: pip
      - name: Instalar dependencias e testar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0 pytest==8.4.2
          python -m pytest -q tests
          python -m compileall -q app.py core.py hikcentral.py devices.py
      - name: Empacotar EXE autocontido
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ValeCadastroFacialNFC --collect-all smartcard --hidden-import win32crypt app.py
          if (!(Test-Path dist/ValeCadastroFacialNFC.exe)) { throw "EXE nao gerado" }
      - name: Disponibilizar executavel
        uses: actions/upload-artifact@v4
        with:
          name: ValeCadastroFacialNFC-Windows
          path: dist/ValeCadastroFacialNFC.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publicar executavel permanente no GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $match = Select-String -Path core.py -Pattern '^APP_VERSION\s*=\s*["'']([^"'']+)["'']'
          if (!$match) { throw "APP_VERSION nao encontrada" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release existente preservada: $tag"
          } else {
            gh release create $tag dist/ValeCadastroFacialNFC.exe --repo $env:GH_REPO --target $env:GITHUB_SHA --title "Vale Cadastro Facial e NFC $tag" --notes "Executavel Windows autocontido. Versao tecnica de testes, ainda nao homologada nas catracas do hotel." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar GitHub Release" }
          }
