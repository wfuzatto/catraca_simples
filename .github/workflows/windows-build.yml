name: Compilar EXE Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: vale-catraca-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
          cache: pip
      - name: Instalar dependencias e testar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0 pytest==8.4.2
          # Build-time download only; same YuNet as face_scanner, SHA256-pinned.
          python scripts/download_face_yunet.py
          if ($LASTEXITCODE -ne 0) { throw "Modelo YuNet oficial inválido ou indisponível" }
          # Import real startup modules before running any tests: catches removed symbols.
          python -c "import app; import core; import modern_ui; import responsive_ui; import devices; import hikcentral; import face_capture_logic; import face_capture_ui; import remote_history; import access_passages; import pending_recovery; import access_receipt; face_capture_logic.LocalFaceDetector(); print('Startup and offline facial detector imports OK: ' + core.APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Falha de importacao dos modulos do aplicativo" }
          # Isolate Tk interpreters: creating/destroying many CTk windows in
          # the same Windows Python process can invalidate Tcl's library context.
          python -m pytest -q tests --ignore=tests/test_ui_windows.py
          if ($LASTEXITCODE -ne 0) { throw "Testes de logica falharam" }
          python -m pytest -q tests/test_ui_windows.py -k "not spinner and not preflight_task and not pending_recovery_button_and_readonly_editor and not editor_allows_replacement_photo_when_download_fails"
          if ($LASTEXITCODE -ne 0) { throw "Testes de interface falharam" }
          # Isolar a nova janela modal: múltiplos Tk roots por processo
          # quebram o contexto tcl_findLibrary no Windows runner.
          python -m pytest -q 'tests/test_ui_windows.py::test_pending_recovery_button_and_readonly_editor'
          if ($LASTEXITCODE -ne 0) { throw "Teste da janela de recuperação falhou" }
          python -m pytest -q 'tests/test_ui_windows.py::test_editor_allows_replacement_photo_when_download_fails'
          if ($LASTEXITCODE -ne 0) { throw "Teste de edição com erro de foto falhou" }
          python -m pytest -q 'tests/test_ui_windows.py::test_registration_spinner_animates_only_during_confirmed_task_and_stops[False]'
          if ($LASTEXITCODE -ne 0) { throw "Teste de spinner/sucesso falhou" }
          python -m pytest -q 'tests/test_ui_windows.py::test_registration_spinner_animates_only_during_confirmed_task_and_stops[True]'
          if ($LASTEXITCODE -ne 0) { throw "Teste de spinner/erro falhou" }
          python -m pytest -q 'tests/test_ui_windows.py::test_preflight_task_has_no_registration_spinner'
          if ($LASTEXITCODE -ne 0) { throw "Teste de preflight falhou" }
          python -m compileall -q app.py core.py hikcentral.py devices.py modern_ui.py responsive_ui.py face_capture_logic.py face_capture_ui.py remote_history.py access_passages.py pending_recovery.py access_receipt.py
          if ($LASTEXITCODE -ne 0) { throw "Compilacao dos modulos falhou" }
      - name: Empacotar EXE autocontido
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ValeCadastroFacialNFC --collect-all customtkinter --collect-all smartcard --collect-data cv2 --add-data "models/face_detection_yunet_2023mar.onnx;models" --add-data "models/face_detection_yunet_LICENSE.txt;models" --hidden-import win32crypt app.py
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist/ValeCadastroFacialNFC.exe)) { throw "EXE nao gerado" }
      - name: Testar inicializacao do EXE compilado sem rede ou HikCentral
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "vale-startup-smoke.json"
          $exePath = (Resolve-Path "dist/ValeCadastroFacialNFC.exe").Path
          $proc = Start-Process -FilePath $exePath -ArgumentList @("--self-test", "`"$reportPath`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "EXE falhou ao iniciar (exit $($proc.ExitCode))" }
          if (!(Test-Path $reportPath)) { throw "EXE nao criou relatorio de inicializacao" }
          $result = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (!$result.ok -or $result.kind -ne "offline_startup_smoke") { throw "Smoke test do EXE falhou" }
          if (!$result.face_detector_ready) { throw "Detector facial YuNet ausente do EXE Windows" }
          if ($result.network_used -or $result.visitor_created) { throw "Smoke test nao deve realizar operacoes remotas" }
          $match = Select-String -Path core.py -Pattern '^APP_VERSION\s*=\s*["'']([^"'']+)["'']'
          $version = $match.Matches[0].Groups[1].Value
          if ($result.version -ne $version) { throw "Versao embutida no EXE incorreta" }
          Write-Host "EXE inicializou e passou no teste offline: $version"
      - name: Disponibilizar executavel
        uses: actions/upload-artifact@v4
        with:
          name: ValeCadastroFacialNFC-Windows
          path: dist/ValeCadastroFacialNFC.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publicar executavel permanente no GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $match = Select-String -Path core.py -Pattern '^APP_VERSION\s*=\s*["'']([^"'']+)["'']'
          if (!$match) { throw "APP_VERSION nao encontrada" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "v$version"
          $asset = "ValeCadastroFacialNFC.exe"
          if (!(Test-Path "dist/$asset")) { throw "Executavel nao foi criado" }
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            # Uma release antiga pode existir sem o EXE, ou com um EXE desatualizado.
            # Substituir o asset após todos os testes e smoke test do Windows.
            gh release upload $tag "dist/$asset" --clobber --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar o EXE na release existente" }
          } else {
            gh release create $tag "dist/$asset" --repo $env:GH_REPO --target $env:GITHUB_SHA --title "Vale Cadastro Facial e NFC $tag" --notes "Executavel Windows autocontido. Versao tecnica de testes, ainda nao homologada nas catracas do hotel." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar GitHub Release" }
          }
          $assets = @(gh release view $tag --repo $env:GH_REPO --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0 -or $asset -notin $assets) {
            throw "Release publicada sem o EXE esperado: $tag/$asset"
          }
          Write-Host "EXE presente na release: https://github.com/$env:GH_REPO/releases/download/$tag/$asset"
